name: Test GoDaddy Connectivity
on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: DNS resolution check
        run: |
          echo "Resolving hostname..."
          getent hosts 1245573.us28.ssh.myftpupload.com || nslookup 1245573.us28.ssh.myftpupload.com || echo "DNS resolution failed"

      - name: Raw TCP port check
        run: |
          echo "Testing raw TCP connection to port 22..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/1245573.us28.ssh.myftpupload.com/22" && echo "Port 22 is open" || echo "Port 22 connection failed or timed out"

      - name: Verbose ssh-keyscan
        run: |
          ssh-keyscan -v -H 1245573.us28.ssh.myftpupload.com
